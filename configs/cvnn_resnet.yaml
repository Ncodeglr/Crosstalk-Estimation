# Banc d'essai par réinjection sur la pile UAVSAR quad-pol (Rosamd_35012_04), pour le ResNet sur le patch brut.
# Lancé par src/train_resnet.py, depuis la racine du dépôt ou depuis src/.
# Le découpage (seed, data.dataset, proportions, max_num_samples) et l'injection (transforms[0].params) doivent rester
# ceux de cvnn_mlp.yaml : le ResNet est alors évalué sur les mêmes patchs de test que le MLP, avec les mêmes injections
# (tests/test_train_resnet.py le vérifie).


task: resnet_crosstalk_injection # Préfixe du dossier de sortie.
seed: 300 # Graine du découpage de cvnn (entraînement / validation / test), la même que cvnn_mlp.yaml. La changer change la partition de test et reconstruit le cache.
train_seed: 3 # Graine de l'entraînement : initialisation des poids et ordre des lots. La faire varier à seed fixe mesure la dispersion d'un entraînement à l'autre, sur la même partition de test.
nepochs: 50 # Comme dans la simulation du ResNet.

model:
  class: ResNet # src/crosstalk/deep_learning/resnet_model.py : le ResNet de cvnn avec une tête de régression, construit par create_model de cvnn.
  layer_mode: complex # Seul mode accepté : l'entrée est complexe.
  num_layers: 5 # Blocs Down de cvnn : chacun double les canaux et divise la taille par deux (64 x 64 -> 4 x 4).
  channels_width: 16 # Canaux après la première convolution ; ils doublent à chaque bloc : 16, 32, 64, 128, 256.
  num_blocks: 1 # Convolutions doubles (DoubleConv) par bloc Down.
  residual: true # Blocs résiduels.
  activation: CReLU # [modReLU, CReLU, zReLU, Cardioid] 
  normalization_layer: "batch"
  downsampling_layer: null # null : chaque bloc réduit la taille par sa première convolution, de pas 2.
  dropout: 0.1 # Exigé par cvnn 

# Les couples (entrée, cible) sont mis en cache dans cache/ (src/crosstalk/deep_learning/cache.py) : la première
# exécution lit une fois dans la pile les patchs gardés, les suivantes relisent le cache (environ 32 Go) tant que cette
# section data et la graine ne changent pas.
data:
  dataset:
    name: UavsarSLC
    trainpath: data/Rosamd_35012_04 # Répertoire des .slc 1x1 et de leurs .ann, relatif à la racine du dépôt.
    patch_size: 64
    patch_stride: 64

  batch_size: 256
  num_workers: 8
  shuffle: True
  valid_ratio: 0.1
  test_ratio: 0.1
  max_num_samples: null # null = toute la pile. La réduction a lieu AVANT le découpage : elle change aussi la partition de test.
  max_train_samples: 300000 # Les 100 000 premiers patchs d'entraînement, comme dans la simulation ; validation et test complets. null = tous.
  recompute_statistics: False

  # Pas de global_scalar_normalize : chaque patch est normalisé dans la transformation, pour que sa covariance soit de
  # trace 1. Placé avant elle, il ferait dépendre l'injection de chaque patch (src/crosstalk/patch_rng.py) de ses constantes.
  transforms:
    - name: crosstalk_injection_resnet # src/crosstalk/deep_learning/crosstalk_injection.py : patch -> (patch injecté (4, H, W), theta_k)
      params:
        seed: 0 # Graine des injections, distincte de la graine globale : la changer, c'est une autre expérience.
        crosstalk_db: [-40.0, -5.0] # La loi d'injection : valeurs et sources dans src/crosstalk/crosstalk_sampler.py.
        term_spread_db: 4.0         # La perte (src/crosstalk/deep_learning/loss.py) lit la même loi pour son moment d'ordre 2 m.
        alpha_module_db: [-3.0, 3.0]
        alpha_phase_deg: [-30.0, 30.0]
        no_injection_rate: 0.1

optim:
  algo: AdamW
  params:
    lr: 0.002 # Comme dans la simulation du ResNet.
    weight_decay: 0.05
  max_norm: 1.0 # Écrêtage de la norme des gradients, fait par train_model de cvnn.

scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 50 # = nepochs : le taux descend jusqu'à eta_min à la dernière époque.
    eta_min: 0.00001
  step_on: epoch

warmup:
  epochs: 0 # Section exigée par train_model de cvnn.

logging:
  logdir: ./logs # Relatif à la racine du dépôt. Chaque entraînement écrit dans logs/<task>_<nom du run wandb, ou date et heure>.
  wandb: # Supprimer cette section pour entraîner sans wandb.
    project: resnet_crosstalk_estimation
    mode: online # offline sans connexion (synchroniser ensuite avec « wandb sync ») ; online demande « wandb login ».
    tags: [resnet, injection]
